project_id = "katan"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/login", "http://127.0.0.1:3000/login"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

